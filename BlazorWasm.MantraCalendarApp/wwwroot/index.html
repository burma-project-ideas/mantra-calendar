<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mantra Practice Calendar</title>
    <meta name="theme-color" content="#315D4A" />
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="BlazorWasm.MantraCalendarApp.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <!--<RadzenTheme Theme="material" @rendermode="InteractiveAuto" />-->
</head>

<body>
    <div id="app">
        <div class="loading-shell" role="status" aria-label="Loading your practice journal">
            <div class="skeleton skeleton-brand" aria-hidden="true"></div>
            <div class="skeleton skeleton-heading" aria-hidden="true"></div>
            <p>Opening your practice journal…</p>
            <div class="skeleton skeleton-calendar" aria-hidden="true"></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <button type="button" class="dismiss" aria-label="Dismiss error">×</button>
    </div>
    <script src="_content/Radzen.Blazor/Radzen.Blazor.min.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js');</script>
</body>

</html>
